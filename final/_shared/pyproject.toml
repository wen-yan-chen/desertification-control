[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcm-figure-kit"
version = "1.4.0"
description = "Shared paper figure recipes and styles for the modeling team"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8", "numpy>=1.24", "Pillow>=9.2"]

[project.optional-dependencies]
replay = ["pandas>=2", "pypdf>=4"]

[tool.setuptools.packages.find]
include = ["mcm_style", "mcm_library"]
namespaces = false

[tool.setuptools.package-data]
mcm_style = ["*.mplstyle", "*.md"]
mcm_library = ["*.md", "latex/*.sty", "latex/*.md", "latex/examples/*.tex"]
